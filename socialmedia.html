<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BayLak Egypt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --neon: #00ffcc; --matrix-green: #0F0; }
        
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%;
            min-height: 100vh;
            background: #000; 
            font-family: 'Courier New', monospace; 
        }
        
        /* قماش خلفية الماتريكس */
        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            opacity: 0.25;
            pointer-events: none;
        }

        /* كارت المحتوى الرئيسي - حجم كامل وثابت بدون أي سكولر */
        .glass-panel {
            background: rgba(0, 0, 0, 0.88);
            border: 1px solid rgba(0, 255, 204, 0.15);
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.05);
            backdrop-filter: blur(8px);
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 450px;
        }

        /* تأثير خط المسح */
        .scanner-line {
            height: 2px;
            background: var(--neon);
            box-shadow: 0 0 15px var(--neon);
            animation: scan 4s infinite linear;
            position: absolute;
            width: 100%;
            left: 0;
            opacity: 0.2;
            pointer-events: none;
        }
        @keyframes scan { 0% { top: -2px; } 100% { top: 100%; } }

        /* ستايل الروابط */
        .link-item {
            border-right: 2px solid transparent;
            transition: 0.2s ease-in-out;
            border-radius: 4px;
        }
        .link-item:hover {
            border-right-color: var(--neon);
            background: rgba(0, 255, 204, 0.08);
            transform: translateX(-4px);
        }

        .icon-box {
            filter: drop-shadow(0 0 3px rgba(255,255,255,0.4));
            border-color: rgba(0, 255, 204, 0.1);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <canvas id="matrixCanvas"></canvas>

    <!-- الكارت بحجم p-8 كامل وبدون أي شريط تمرير -->
    <div class="glass-panel rounded-xl p-8 relative overflow-hidden my-auto">
        <div class="scanner-line"></div>
        
        <div class="text-center mb-8 relative z-20">
            <h1 class="text-3xl font-black tracking-widest mb-1" style="color: var(--neon); text-shadow: 0 0 10px var(--neon);">
                BayLak-Egypt
            </h1>
            <div class="text-[10px] text-gray-600 uppercase tracking-[0.4em]">the super hacker</div>
        </div>

        <div id="links-container" class="space-y-4 relative z-20">
            <div class="text-center py-6">
                <span class="animate-pulse text-xs text-gray-400">CONNECTING...</span>
            </div>
        </div>
    </div>

    <script>
        // --- خلفية الماتريكس ---
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        canvas.height = window.innerHeight;
        canvas.width = window.innerWidth;

        const katakana = "アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン";
        const latin = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const nums = "0123456789";
        const alphabet = katakana + latin + nums;

        const fontSize = 16;
        let columns = canvas.width / fontSize;
        let drops = [];
        
        for (let x = 0; x < columns; x++) {
            drops[x] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 30);

        window.addEventListener('resize', () => {
            canvas.height = window.innerHeight;
            canvas.width = window.innerWidth;
        });

        // --- جلب الروابط ---
        async function loadLinks() {
            try {
                const response = await fetch('mysocial.txt');
                const text = await response.text();
                const container = document.getElementById('links-container');
                container.innerHTML = '';

                const lines = text.trim().split('\n');

                lines.forEach(line => {
                    if (!line.includes('=')) return;
                    let [label, url] = line.split('=').map(s => s.trim());
                    let fullUrl = url;
                    if (!fullUrl.startsWith('http')) fullUrl = 'https://' + fullUrl;

                    let domain;
                    try { domain = new URL(fullUrl).hostname; } catch(e) { domain = fullUrl.split('/')[0]; }

                    const iconUrl = `https://www.google.com/s2/favicons?sz=64&domain=${domain}`;

                    const html = `
                        <a href="${fullUrl}" target="_blank" class="link-item flex items-center p-3 group">
                            <div class="icon-box w-10 h-10 flex items-center justify-center bg-white/5 rounded-md border border-white/10 ml-4 p-1 shrink-0">
                                <img src="${iconUrl}" 
                                     alt="icn" 
                                     class="w-6 h-6 object-contain"
                                     onerror="this.src='https://cdn-icons-png.flaticon.com/512/1243/1243420.png'">
                            </div>
                            <div class="flex flex-col min-w-0 flex-1">
                                <span class="text-xs font-bold text-gray-100 group-hover:text-[var(--neon)] transition-colors uppercase tracking-wider truncate">${label}</span>
                                <span class="text-[8px] text-gray-700 lowercase mt-0.5 truncate">${domain}</span>
                            </div>
                            <div class="mr-auto opacity-0 group-hover:opacity-100 transition-opacity pr-2">
                                <span class="text-[var(--neon)] text-xs font-bold">[#]</span>
                            </div>
                        </a>
                    `;
                    container.innerHTML += html;
                });
            } catch (error) {
                const container = document.getElementById('links-container');
                container.innerHTML = `<p class="text-red-500 text-xs text-center">FILE NOT FOUND: mysocial.txt</p>`;
            }
        }
        loadLinks();
    </script>
</body>
</html>
