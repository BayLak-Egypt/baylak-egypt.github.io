<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
</head>
<body>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        
        // التحقق مما إذا كان الرابط يحتوي على معامل img
        if (urlParams.has('img')) {
            // إذا وجد img، يذهب إلى صفحة المعالجة مع الاحتفاظ بالبيانات
            window.location.replace("img.html" + window.location.search);
        } else {
            // إذا لم يجد img أو تم فتح الرابط الأساسي، يوجهه إلى مدونة بلوجر
            window.location.replace("https://baylak-egypt.blogspot.com/");
        }
    </script>
</body>
</html>
