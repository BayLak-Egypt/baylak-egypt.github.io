<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Redirecting to Image...</title>
</head>
<body>

    <script>
        async function redirectToImage() {
            const urlParams = new URLSearchParams(window.location.search);
            const key = urlParams.get('img');

            if (!key) {
                document.body.innerHTML = "الرجاء تحديد اسم الصورة.";
                return;
            }

            try {
                // منع التخزين المؤقت لجلب أحدث تحديثات الـ JSON
                const response = await fetch('img.json?' + new Date().getTime());
                const data = await response.json();

                if (data[key]) {
                    const imageName = data[key];
                    // الرابط المباشر لصورة الـ GIF داخل مجلد img
                    const imageDirectUrl = `img/${imageName}.gif`;

                    // إعادة توجيه المتصفح مباشرة إلى ملف الصورة الحقيقي
                    window.location.replace(imageDirectUrl);
                } else {
                    document.body.innerHTML = "الصورة غير مسجلة في النظام.";
                }
            } catch (error) {
                document.body.innerHTML = "حدث خطأ في النظام.";
            }
        }

        redirectToImage();
    </script>

</body>
</html>
