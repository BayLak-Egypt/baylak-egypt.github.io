<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Redirecting GIF...</title>
</head>
<body>

    <div id="status" style="text-align:center; margin-top:20vh; font-family:sans-serif;">جاري تحميل الصورة...</div>

    <script>
        async function redirectToGIF() {
            const urlParams = new URLSearchParams(window.location.search);
            let key = urlParams.get('img');
            const statusDiv = document.getElementById('status');

            if (!key) {
                statusDiv.innerText = "الرجاء تحديد اسم الصورة.";
                return;
            }

            // إزالة .gif لو كتبها المستخدم في النهاية لتطابق مفتاح الـ JSON
            if (key.endsWith('.gif')) {
                key = key.replace('.gif', '');
            }

            try {
                // جلب ملف الـ JSON
                const response = await fetch('img.json?' + new Date().getTime());
                const data = await response.json();

                if (data[key]) {
                    const imageName = data[key];
                    // الرابط المباشر الحقيقي لملف الـ GIF داخل مجلد img
                    const directImageUrl = `img/${imageName}.gif`;

                    // إعادة توجيه المتصفح مباشرة لملف الصورة الخام
                    window.location.replace(directImageUrl);
                } else {
                    statusDiv.innerText = "الصورة غير مسجلة في ملف النظام.";
                }
            } catch (error) {
                statusDiv.innerText = "حدث خطأ في النظام.";
            }
        }

        redirectToGIF();
    </script>

</body>
</html>
