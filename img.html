<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Redirecting to GIF...</title>
</head>
<body>

    <div id="status" style="text-align:center; margin-top:20vh; font-family:sans-serif;">جاري تحويلك لرابط الصورة...</div>

    <script>
        async function redirectToDirectImage() {
            const urlParams = new URLSearchParams(window.location.search);
            let key = urlParams.get('img');
            const statusDiv = document.getElementById('status');

            if (!key) {
                statusDiv.innerText = "الرجاء تحديد اسم الصورة.";
                return;
            }

            // إذا وُجدت لاحقة .gif في نهاية الباراميتر، نقوم بإزالتها لتطابق مفتاح الـ JSON
            if (key.endsWith('.gif')) {
                key = key.replace('.gif', '');
            }

            try {
                // جلب ملف الـ JSON
                const response = await fetch('img.json?' + new Date().getTime());
                const data = await response.json();

                if (data[key]) {
                    const imageName = data[key];
                    // بناء الرابط الأساسي والمباشر للصورة داخل مجلد img
                    // (نقوم هنا بعمل رابط مطلق لضمان نجاح التحويل مهما كان مسار الصفحة)
                    const baseUrl = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
                    const directImageUrl = baseUrl + `img/${imageName}.gif`;

                    // التحويل الفوري والمباشر لرابط الصورة الأساسي
                    window.location.replace(directImageUrl);
                } else {
                    statusDiv.innerText = "الصورة غير مسجلة في ملف النظام.";
                }
            } catch (error) {
                statusDiv.innerText = "حدث خطأ في النظام.";
            }
        }

        redirectToDirectImage();
    </script>

</body>
</html>
